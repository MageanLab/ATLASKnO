# SPDX-License-Identifier: MIT
# ATLASKnO — Semantic Data & Schema Validation
#
# Triggers on PRs that modify RDF, taxonomy, or schema data files.
# Three jobs: RDF syntax, taxonomy integrity, SHACL compliance.

name: "Semantic Validation"

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "data/**"
      - "schedules/**"
      - "shapes/**"
      - "**.ttl"
      - "**.rdf"
      - "**.jsonld"
      - "**.n3"
      - "**.nt"
      - "**.csv"

concurrency:
  group: semantic-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── RDF/SKOS Syntax Verification ─────────────────────────────────────
  rdf-syntax:
    name: "RDF Syntax Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rdflib

      - name: Validate RDF syntax
        run: python scripts/validate_rdf_syntax.py

  # ── Taxonomy & Graph Integrity ───────────────────────────────────────
  taxonomy-integrity:
    name: "Taxonomy Integrity"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rdflib

      - name: Validate taxonomy integrity
        run: python scripts/validate_taxonomy_integrity.py

  # ── SHACL Shape Compliance ───────────────────────────────────────────
  shacl-compliance:
    name: "SHACL Compliance"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rdflib pyshacl

      - name: Validate SHACL compliance
        run: python scripts/validate_shacl.py
