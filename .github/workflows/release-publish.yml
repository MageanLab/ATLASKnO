# SPDX-License-Identifier: MIT
# ATLASKnO — Production Release & Distribution
#
# Triggers on SemVer tags pushed to main, or manual dispatch.
# Jobs: changelog generation, GitHub Release, PyPI publish, SLSA attestation.

name: "Release & Publish"

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"    # v1.0.0, v0.2.3-beta, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v1.0.0). Leave empty to use latest tag."
        required: false
        type: string
      dry_run:
        description: "Dry run — build but do not publish"
        required: false
        default: false
        type: boolean

permissions:
  contents: write       # Create releases
  id-token: write       # PyPI OIDC trusted publishing
  attestations: write   # SLSA attestations

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Determine Version ────────────────────────────────────────────────
  prepare:
    name: "Prepare Release"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "📦 Release: ${TAG} (version ${VERSION})"

  # ── Build Artifacts ──────────────────────────────────────────────────
  build:
    name: "Build Artifacts"
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package
        run: twine check dist/*

      - name: Upload Python packages
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/
          retention-days: 90

  # ── Bundle Datasets ──────────────────────────────────────────────────
  bundle-datasets:
    name: "Bundle Datasets"
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bundle dataset archives
        run: |
          chmod +x scripts/bundle_datasets.sh
          ./scripts/bundle_datasets.sh "${{ needs.prepare.outputs.tag }}" release-assets/

      - name: Upload dataset bundles
        uses: actions/upload-artifact@v4
        with:
          name: dataset-bundles
          path: release-assets/
          if-no-files-found: ignore
          retention-days: 90

  # ── Changelog Generation ─────────────────────────────────────────────
  changelog:
    name: "Generate Changelog"
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      changelog: ${{ steps.cliff.outputs.content }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog with git-cliff
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md
          retention-days: 90

  # ── GitHub Release ───────────────────────────────────────────────────
  github-release:
    name: "GitHub Release"
    runs-on: ubuntu-latest
    needs: [prepare, build, bundle-datasets, changelog]
    if: ${{ !inputs.dry_run }}
    steps:
      - name: Download Python packages
        uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist/

      - name: Download dataset bundles
        uses: actions/download-artifact@v4
        with:
          name: dataset-bundles
          path: release-assets/
        continue-on-error: true  # Datasets may not exist yet

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog

      - name: Generate consolidated checksums
        run: |
          mkdir -p all-assets
          cp dist/* all-assets/ 2>/dev/null || true
          cp release-assets/* all-assets/ 2>/dev/null || true
          cd all-assets
          sha256sum * > SHA256SUMS 2>/dev/null || echo "No files to checksum"
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "ATLASKnO ${{ needs.prepare.outputs.tag }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          files: |
            all-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── PyPI Publish (Trusted Publishing) ────────────────────────────────
  pypi-publish:
    name: "Publish to PyPI"
    runs-on: ubuntu-latest
    needs: [prepare, build, github-release]
    if: ${{ !inputs.dry_run }}
    environment:
      name: pypi
      url: https://pypi.org/project/atlaskno/
    steps:
      - name: Download Python packages
        uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No API token needed — uses OIDC Trusted Publishing
        # Configure at: https://pypi.org/manage/project/atlaskno/settings/publishing/

  # ── SLSA Attestation & Provenance ────────────────────────────────────
  attestation:
    name: "Build Attestation"
    runs-on: ubuntu-latest
    needs: [build, bundle-datasets]
    if: ${{ !inputs.dry_run }}
    steps:
      - name: Download Python packages
        uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist/

      - name: Download dataset bundles
        uses: actions/download-artifact@v4
        with:
          name: dataset-bundles
          path: release-assets/
        continue-on-error: true

      - name: Attest Python packages
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Attest dataset bundles
        if: ${{ hashFiles('release-assets/*') != '' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release-assets/*"
