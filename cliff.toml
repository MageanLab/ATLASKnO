# git-cliff configuration for ATLASKnO
# https://git-cliff.org/docs/configuration

[changelog]
# changelog header
header = """
# Changelog\n
All notable changes to ATLASKnO will be documented in this file.\n
"""
# template for the changelog body
body = """
{%- macro remote_url() -%}
  https://github.com/MageanLab/ATLASKnO
{%- endmacro -%}

{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {% if commit.breaking %}[**BREAKING**] {% endif %}\
            {{ commit.message | upper_first }}\
            ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))\
    {%- endfor %}
{% endfor %}\n
"""
# template for the changelog footer
footer = """
---
*Generated by [git-cliff](https://git-cliff.org)*
"""
# remove the leading and trailing whitespace from the templates
trim = true

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
filter_unconventional = true
split_commits = false

commit_parsers = [
    { message = "^feat", group = "🚀 Features" },
    { message = "^fix", group = "🐛 Bug Fixes" },
    { message = "^doc", group = "📚 Documentation" },
    { message = "^perf", group = "⚡ Performance" },
    { message = "^refactor", group = "🔧 Refactoring" },
    { message = "^style", group = "🎨 Styling" },
    { message = "^test", group = "🧪 Testing" },
    { message = "^ci", group = "⚙️ CI/CD" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore|^misc", group = "📦 Miscellaneous" },
    { message = "^data", group = "📊 Data & Schemas" },
    { body = ".*security", group = "🔒 Security" },
]

# protect breaking changes from being skipped
protect_breaking_commits = false
# filter out merge commits
filter_merge_commits = true
# regex for parsing and grouping commits
tag_pattern = "v[0-9].*"
# sort the tags topologically
topo_order = false
# sort commits inside sections by oldest to newest
sort_commits = "oldest"
